name: Local CI

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout Repo 1
      - name: Checkout Python application
        uses: actions/checkout@v4

      # 2. Show project files
      - name: Show project files
        run: |
          echo "Project files:"
          ls -la

      # 3. Test Python syntax
      - name: Test Python syntax
        run: |
          python3 -m py_compile app.py

      # 4. Login to GitHub Container Registry
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 5. Build Docker image
      - name: Build Docker image
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')

          docker build \
            -t ghcr.io/$OWNER/python-localrunners:${{ github.sha }} .

      # 6. Push Docker image to GHCR
      - name: Push Docker image
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')

          docker push \
            ghcr.io/$OWNER/python-localrunners:${{ github.sha }}

      # 7. Checkout Repo 2
      - name: Checkout Kubernetes repository
        uses: actions/checkout@v4
        with:
          repository: Prethika88/Kubernates
          token: ${{ secrets.KUBERNETES_REPO_TOKEN }}
          path: kubernates

      # 8. Update Kubernetes deployment image
      - name: Update Kubernetes image
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')

          sed -i \
            "s|image: .*|image: ghcr.io/$OWNER/python-localrunners:${{ github.sha }}|" \
            kubernates/k8s/deployment.yaml

      # 9. Show updated deployment
      - name: Show updated Kubernetes deployment
        run: |
          echo "Updated Kubernetes deployment:"
          cat kubernates/k8s/deployment.yaml

      # 10. Commit and push change to Repo 2
      - name: Push Kubernetes update
        run: |
          cd kubernates

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add k8s/deployment.yaml

          git commit \
            -m "Update Python app image to ${{ github.sha }}" \
            || echo "No changes to commit"

          git push origin main